name: Merge V2Ray Subscriptions

on:
  schedule:
    - cron: '0 */1 * * *'  # runs every hour
  workflow_dispatch:        # allows manual trigger from GitHub UI
  push:
    paths:
      - 'base.txt'          # also runs when base.txt is updated

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push all.txt / healthy.txt back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and merge all subscriptions
        run: |
          echo "Reading URLs from base.txt..."
          > all.txt   # clear / create output file

          while IFS= read -r url || [ -n "$url" ]; do
            # skip empty lines and comments
            [[ -z "$url" || "$url" == \#* ]] && continue

            echo "Fetching: $url"
            content=$(curl -fsSL --max-time 30 "$url" 2>/dev/null)

            if [ $? -eq 0 ] && [ -n "$content" ]; then
              echo "$content" >> all.txt
              echo "  ✓ OK"
            else
              echo "  ✗ Failed or empty — skipping"
            fi
          done < base.txt

          total=$(wc -l < all.txt)
          echo ""
          echo "Done. Total lines in all.txt: $total"

      - name: Download xray-knife
        run: |
          curl -fsSL -o xray-knife.zip \
            https://github.com/lilendian0x00/xray-knife/releases/latest/download/Xray-knife-linux-64.zip
          unzip -o xray-knife.zip
          chmod +x xray-knife

      - name: Health-check configs and build healthy.txt
        run: |
          # --prescan does a fast liveness check first so dead configs are
          # dropped quickly, before the slower full connection test runs.
          # --mdelay 250 keeps only configs with a real ping under 250ms.
          ./xray-knife http \
            -f all.txt \
            -o healthy.txt \
            --prescan \
            --prescan-workers 300 \
            --mdelay 250 \
            -v || true

          if [ -f healthy.txt ]; then
            total=$(wc -l < healthy.txt)
            echo "Healthy configs: $total"
          else
            echo "No healthy.txt produced — creating an empty one."
            > healthy.txt
          fi

      - name: Commit and push all.txt + healthy.txt
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all.txt healthy.txt
          # only commit if there are actual changes
          git diff --cached --quiet && echo "No changes — skipping commit." || \
            git commit -m "chore: update all.txt / healthy.txt [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push
